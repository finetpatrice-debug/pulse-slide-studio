name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build with Vite
        run: |
          npx vite build --base=/pulse-slide-studio/
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          mkdir -p dist/join/38NKMQ
          cp dist/index.html dist/join/38NKMQ/index.html
        env:
          VITE_SUPABASE_URL: https://ztjppnonfccdytvgpqrl.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_kaNBOm-Q29rHSWImjMnWAg_E0QB16Eu
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
